<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <!-- 全局样式：body 背景已使用 assets/img/bg.png -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <!-- 页面外层容器：限制宽度并水平居中 -->
    <div class="profile-container">

        <!-- 主卡片（毛玻璃效果）：上下弹性布局，上头像 + 下内容 -->
        <div class="cards-content profile-card">

            <!-- ① 头像：位于圆形框内 -->
            <div class="avatar-circle">
                <img src="assets/img/zycdzyj.jpg" alt="头像">
            </div>

            <!-- ② 内容区：纵向排列 -->
            <div class="profile-body">
                <div class="blank-row"><h1>Pilgrimage-朝圣道</h1></div>
                <!-- 第一行（后续可在此填充内容） -->
                <div class="blank-row"><h1>每个生命都是朝圣的漫游,每条路都是通向自我的征途.</h1></div>

                <!-- 第二行：留空（后续可在此填充内容） -->
                <div class="blank-row"><h1>Typescript,Pythpn学习者开发者,电报圈,挂圈,接口逆向,微信无违规</h1></div>

                <!-- 第三行：技能图标 -->
                <p class="skills">
                    <a href="https://skillicons.dev" target="_blank" rel="noopener noreferrer">
                        <img src="https://skillicons.dev/icons?i=python,typescript,html,css,js,vscode,powershell,git"
                             alt="">
                    </a>
                </p>

                <!-- 第四行：联系我（水平排列，网址暂留空） -->
                <div class="contact-row">
                    <a class="contact-icon" href="https://t.me/Zycdzyj" title="Telegram" aria-label="Telegram">
                        <img src="assets/img/telegram.png" alt="Telegram">
                    </a>
                    <a class="contact-icon" href="https://wa.me/qr/B5DFMCJ6YJZNH1" title="WhatsApp" aria-label="WhatsApp">
                        <img src="assets/img/wa.webp" alt="WhatsApp">
                    </a>
                    <a class="contact-icon" href="https://x.com/zycdzyj" title="X" aria-label="X">
                        <img src="assets/img/x.png" alt="X">
                    </a>
                    <a class="icon" href="https://space.bilibili.com/3706931743033366" title="bilbil" aria-label="bilbil">
                        <img src="assets/img/bilibili.png" alt="bilbil">
                    </a>
                    <a class="icon" href="mailto:mzycdzyj@163.com" title="Email" aria-label="Email">
                        <img src="assets/img/email.png" alt="Email">
                    </a>
                    <a class="contact-icon" href="github.com/zycdzyj" title="Email" aria-label="Email">
                        <img src="assets/img/github.png" alt="Github">
                    </a>
                </div>

            </div>

        </div>

    </div>
</body>

</html>
